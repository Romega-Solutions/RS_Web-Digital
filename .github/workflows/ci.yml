name: CI
on:
  push:
    branches: [main, master, redesign/ui-audit-fixes]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
# The jobs only read the repository, so the token gets read access and nothing else.
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.9
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test:unit
      - run: pnpm test
      - run: pnpm run check:env:production
        env:
          NEXT_PUBLIC_SITE_URL: https://www.romega-solutions.com
          RESEND_API_KEY: re_ci_placeholder_123456
          ADMIN_EMAIL: info@romega-solutions.com
          RECAPTCHA_TIMEOUT_MS: "5000"
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run audit:responsive
      - run: pnpm run audit:a11y
      - run: pnpm run audit:keyboard
      - run: pnpm run audit:product
      - run: pnpm run audit:visual
